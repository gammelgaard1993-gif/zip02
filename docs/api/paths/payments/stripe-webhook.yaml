post:
  summary: Receive a Stripe-style payment webhook
  operationId: paymentWebhook
  parameters:
    - in: header
      name: Stripe-Signature
      required: true
      schema:
        type: string
      description: Stripe signature in the format `t=<unix>,v1=<hmac>`.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/PaymentWebhookRequest'
  responses:
    '200':
      description: Payment recorded
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/schemas/PaymentRecord'
    '401':
      description: Webhook signature validation failed
    '409':
      description: Ticket state prevented a paid transition
    '503':
      description: Webhook secret is not configured
