post:
  summary: Reserve a ticket
  operationId: reserveTicket
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ReserveTicketRequest'
  responses:
    '201':
      description: Ticket reserved
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/schemas/TicketResponse'
    '400':
      description: Validation error
