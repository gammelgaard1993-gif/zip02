schemas:
  GeofenceRequest:
    type: object
    required:
      - latitude
      - longitude
      - radiusMeters
    properties:
      latitude:
        type: number
        format: double
        minimum: -90
        maximum: 90
      longitude:
        type: number
        format: double
        minimum: -180
        maximum: 180
      radiusMeters:
        type: number
        format: double
        minimum: 1
        maximum: 100000
  CreateEventRequest:
    type: object
    required:
      - name
      - startAtUtc
      - endAtUtc
      - capacity
      - geofence
    properties:
      name:
        type: string
        maxLength: 200
      startAtUtc:
        type: string
        format: date-time
      endAtUtc:
        type: string
        format: date-time
      capacity:
        type: integer
        format: int32
        minimum: 1
      geofence:
        $ref: '#/schemas/GeofenceRequest'
  UpdateEventRequest:
    type: object
    properties:
      name:
        type: string
        maxLength: 200
      startAtUtc:
        type: string
        format: date-time
      endAtUtc:
        type: string
        format: date-time
      capacity:
        type: integer
        format: int32
        minimum: 1
      geofence:
        $ref: '#/schemas/GeofenceRequest'
  GeofenceResponse:
    allOf:
      - $ref: '#/schemas/GeofenceRequest'
  EventResponse:
    type: object
    required:
      - id
      - name
      - startAtUtc
      - endAtUtc
      - capacity
      - geofence
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      startAtUtc:
        type: string
        format: date-time
      endAtUtc:
        type: string
        format: date-time
      capacity:
        type: integer
        format: int32
      geofence:
        $ref: '#/schemas/GeofenceResponse'
  ReserveTicketRequest:
    type: object
    required:
      - eventId
      - attendeeId
      - attendeeEmail
      - idempotencyKey
    properties:
      eventId:
        type: string
        format: uuid
      attendeeId:
        type: string
        maxLength: 100
      attendeeEmail:
        type: string
        format: email
        maxLength: 320
      idempotencyKey:
        type: string
        maxLength: 100
  UpdateTicketRequest:
    type: object
    properties:
      attendeeEmail:
        type: string
        format: email
        maxLength: 320
      notes:
        type: string
        maxLength: 500
  TicketResponse:
    type: object
    required:
      - id
      - eventId
      - attendeeId
      - attendeeEmail
      - status
      - reservedAtUtc
      - expiresAtUtc
    properties:
      id:
        type: string
        format: uuid
      eventId:
        type: string
        format: uuid
      attendeeId:
        type: string
      attendeeEmail:
        type: string
      status:
        type: string
        enum: [Reserved, Paid, CheckedIn, Expired, Refunded, Cancelled]
      reservedAtUtc:
        type: string
        format: date-time
      expiresAtUtc:
        type: string
        format: date-time
      paidAtUtc:
        type: string
        format: date-time
        nullable: true
      checkedInAtUtc:
        type: string
        format: date-time
        nullable: true
      expiredAtUtc:
        type: string
        format: date-time
        nullable: true
      refundedAtUtc:
        type: string
        format: date-time
        nullable: true
      cancelledAtUtc:
        type: string
        format: date-time
        nullable: true
      notes:
        type: string
        nullable: true
  PaymentWebhookRequest:
    type: object
    required:
      - provider
      - providerEventId
      - ticketId
      - eventId
      - amountMinorUnits
      - currency
      - status
      - occurredAtUtc
      - correlationId
    properties:
      provider:
        type: string
        maxLength: 50
      providerEventId:
        type: string
        maxLength: 200
      ticketId:
        type: string
        format: uuid
      eventId:
        type: string
        format: uuid
      amountMinorUnits:
        type: integer
        format: int64
        minimum: 1
      currency:
        type: string
        maxLength: 3
      status:
        type: string
        enum: [Pending, Succeeded, Failed, Refunded]
      occurredAtUtc:
        type: string
        format: date-time
      correlationId:
        type: string
        maxLength: 200
  PaymentRecord:
    type: object
    required:
      - id
      - ticketId
      - eventId
      - provider
      - providerEventId
      - amountMinorUnits
      - currency
      - status
      - occurredAtUtc
      - processedAtUtc
      - correlationId
    properties:
      id:
        type: string
        format: uuid
      ticketId:
        type: string
        format: uuid
      eventId:
        type: string
        format: uuid
      provider:
        type: string
      providerEventId:
        type: string
      amountMinorUnits:
        type: integer
        format: int64
      currency:
        type: string
      status:
        type: string
        enum: [Pending, Succeeded, Failed, Refunded]
      occurredAtUtc:
        type: string
        format: date-time
      processedAtUtc:
        type: string
        format: date-time
      correlationId:
        type: string
