GeofenceRequest:
  type: object
  required:
    - latitude
    - longitude
    - radiusMeters
  properties:
    latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
    longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
    radiusMeters:
      type: number
      format: double
      minimum: 1
      maximum: 100000
CreateEventRequest:
  type: object
  required:
    - name
    - startAtUtc
    - endAtUtc
    - capacity
    - geofence
  properties:
    name:
      type: string
      maxLength: 200
    startAtUtc:
      type: string
      format: date-time
    endAtUtc:
      type: string
      format: date-time
    capacity:
      type: integer
      format: int32
      minimum: 1
    geofence:
      $ref: '#/GeofenceRequest'
UpdateEventRequest:
  type: object
  properties:
    name:
      type: string
      maxLength: 200
    startAtUtc:
      type: string
      format: date-time
    endAtUtc:
      type: string
      format: date-time
    capacity:
      type: integer
      format: int32
      minimum: 1
    geofence:
      $ref: '#/GeofenceRequest'
GeofenceResponse:
  allOf:
    - $ref: '#/GeofenceRequest'
EventResponse:
  type: object
  required:
    - id
    - name
    - startAtUtc
    - endAtUtc
    - capacity
    - geofence
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    startAtUtc:
      type: string
      format: date-time
    endAtUtc:
      type: string
      format: date-time
    capacity:
      type: integer
      format: int32
    geofence:
      $ref: '#/GeofenceResponse'
