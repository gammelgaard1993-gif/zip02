openapi: 3.1.0
info:
  title: zip02 API
  version: 1.0.0
  description: Event MVP API for organizer event creation and geofence management.
servers:
  - url: https://localhost:5001
paths:
  /events:
    post:
      summary: Create an event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Validation error
  /events/{id}:
    get:
      summary: Get an event by id
      operationId: getEventById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: Event not found
    patch:
      summary: Partially update an event
      operationId: updateEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Validation error
        '404':
          description: Event not found
components:
  schemas:
    GeofenceRequest:
      type: object
      required:
        - latitude
        - longitude
        - radiusMeters
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        radiusMeters:
          type: number
          format: double
          minimum: 1
          maximum: 100000
    CreateEventRequest:
      type: object
      required:
        - name
        - startAtUtc
        - endAtUtc
        - capacity
        - geofence
      properties:
        name:
          type: string
          maxLength: 200
        startAtUtc:
          type: string
          format: date-time
        endAtUtc:
          type: string
          format: date-time
        capacity:
          type: integer
          format: int32
          minimum: 1
        geofence:
          $ref: '#/components/schemas/GeofenceRequest'
    UpdateEventRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        startAtUtc:
          type: string
          format: date-time
        endAtUtc:
          type: string
          format: date-time
        capacity:
          type: integer
          format: int32
          minimum: 1
        geofence:
          $ref: '#/components/schemas/GeofenceRequest'
    GeofenceResponse:
      allOf:
        - $ref: '#/components/schemas/GeofenceRequest'
    EventResponse:
      type: object
      required:
        - id
        - name
        - startAtUtc
        - endAtUtc
        - capacity
        - geofence
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startAtUtc:
          type: string
          format: date-time
        endAtUtc:
          type: string
          format: date-time
        capacity:
          type: integer
          format: int32
        geofence:
          $ref: '#/components/schemas/GeofenceResponse'
