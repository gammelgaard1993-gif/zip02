openapi: 3.1.0
info:
  title: zip02 API
  version: 1.0.0
  description: MVP API for organizer events, ticket reservation, and Stripe-style payment webhooks.
servers:
  - url: https://localhost:5001
paths:
  /events:
    $ref: './paths/events/create.yaml'
  /events/{id}:
    $ref: './paths/events/item.yaml'
  /tickets/reserve:
    $ref: './paths/tickets/reserve.yaml'
  /tickets/{id}:
    $ref: './paths/tickets/item.yaml'
  /payments/stripe/webhook:
    $ref: './paths/payments/stripe-webhook.yaml'
components:
  schemas:
    $ref: './components/schemas.yaml#/schemas'
